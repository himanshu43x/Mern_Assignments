
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Nature Gallery</h1>
            <p class="subtitle">Explore beautiful landscapes around the world</p>
        </header>

        <section>

            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Beautiful green landscape">
                    <h3>Green Landscape</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Mountain lake scenery">
                    <h3>Mountain Lake</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" alt="Snow covered mountains">
                    <h3>Snow Mountains</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Beautiful lake and mountains">
                    <h3>Lake View</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800" alt="Mountain under starry sky">
                    <h3>Night Mountains</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800" alt="Forest and mountain landscape">
                    <h3>Nature Forest</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Green forest trees">
                    <h3>Green Forest</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800" alt="Wildlife in nature">
                    <h3>Wildlife</h3>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Beautiful scenic countryside">
                    <h3>Beautiful Valley</h3>
                </div>

            </div>
        </section>


    </div>

</body>
</html>
