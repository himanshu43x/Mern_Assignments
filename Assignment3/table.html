
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Store - T-Shirt Stock Chart</title>
</head>
<body>

    <h1>Campus Store - T-Shirt Size & Stock Chart</h1>
    
<table border="1">
    <thead>
        <tr>
            <th rowspan="2">Brand</th>
            <th rowspan="2">SKU</th>
            <th rowspan="2">Size</th>
            <th colspan="4">Measurements (inches)</th>
            <th rowspan="2">Colour</th>
            <th rowspan="2">Stock</th>
            <th rowspan="2">Price</th>
        </tr>

        <tr>
            <th>Chest</th>
            <th>Waist</th>
            <th>Length</th>
            <th>Sleeve</th>
        </tr>
       

    </thead>
</table>


</body>
</html>
